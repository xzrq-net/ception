[package]
name = "ception"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shell-words = "1.1.1"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "io-util", "process", "signal", "time", "sync", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
